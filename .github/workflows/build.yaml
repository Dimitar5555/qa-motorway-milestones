name: Build milestones data and upload as artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm install

      - name: Run build script
        run: npm run build

      - name: Upload milestones artifact
        uses: actions/upload-artifact@v4
        with:
          name: milestones-data
          path: milestones-data.json
